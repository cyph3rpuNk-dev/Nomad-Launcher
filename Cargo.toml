[workspace]
resolver = "2"
members = ["core", "launchers/*"]
exclude = ["vendor/accesskit_winit-0.32.2"]

[workspace.package]
version = "1.0.9"
edition = "2021"
license = "MIT"
rust-version = "1.92"

[workspace.dependencies]
nomad-core = { path = "core" }

[patch.crates-io]
# Preserve Windows accessibility without the unused Unix D-Bus backend.
# Source provenance and removal criteria: vendor/accesskit_winit-0.32.2/NOMAD.md.
accesskit_winit = { path = "vendor/accesskit_winit-0.32.2" }

[profile.release]
# Turn silent integer wraparound into a loud panic in release builds. The
# arithmetic in a launcher is tiny so the cost is negligible, and fail-loud is
# the right posture for a privacy/security tool — a wraparound becomes a crash,
# not a latent miscalculation.
overflow-checks = true
