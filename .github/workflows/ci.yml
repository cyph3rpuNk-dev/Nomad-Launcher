name: CI

on:
  push:
    branches: [main]
  pull_request:

# Default-deny: jobs start with no GITHUB_TOKEN permissions and must opt in
# below. Both jobs only need read access to clone the repo.
permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1

      - name: Canonical check
        run: pwsh -NoProfile -File scripts/check.ps1 -SkipAudit

  audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependencies
        # RUSTSEC-2023-0071 (rsa "Marvin" timing sidechannel) is not exploitable
        # in Nomad: the `pgp` crate uses RSA only to VERIFY detached signatures
        # (public-key operations), never to decrypt, and there is no fixed
        # upstream `rsa` release. Re-evaluate if a patched `rsa` ships or Nomad's
        # cryptographic usage changes.
        # All warning classes (including yanked crates) fail the canonical gate.
        run: pwsh -NoProfile -File scripts/check.ps1 -AuditOnly

  msrv:
    name: Rust 1.92 compatibility
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: '1.92'
      - name: Check workspace at MSRV
        run: cargo +1.92 check --workspace --all-targets --locked
