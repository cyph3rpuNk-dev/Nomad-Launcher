name: Release

# Build the launchers from source on every v* tag and attach them to a DRAFT
# GitHub release with build provenance attestation, so users can check that a
# published binary came from this repository's code instead of trusting an
# exe built on a maintainer's machine (see docs/VERIFYING-RELEASES.md).
#
# What stays local, by design: the detached GPG signature over SHA256SUMS.
# The owner downloads SHA256SUMS from the draft, signs it offline, attaches
# SHA256SUMS.asc, and only then publishes the release.

on:
  push:
    tags: ["v*"]

# Default-deny: the job opts into exactly the permissions it needs below.
permissions: {}

# Serialize reruns for the same tag instead of racing draft creation/upload.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build, attest, draft release
    runs-on: windows-latest
    permissions:
      contents: write # create the draft release and upload assets
      id-token: write # OIDC token for Sigstore signing of the attestation
      attestations: write # persist the provenance attestation
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Check release target before building or attesting
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: .\scripts\publish-draft-release.ps1 -Tag $env:TAG -Repository $env:GITHUB_REPOSITORY -CheckOnly

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install dependency audit tool
        run: cargo install cargo-audit --locked

      - name: Canonical validation
        run: pwsh -NoProfile -File scripts/check.ps1

      - name: Verify current Chromium compatibility before building release artifacts
        run: cargo test --locked --target x86_64-pc-windows-msvc -p nomad-core --test upstream_extract chromium_release -- --ignored --nocapture

      # No cargo cache on purpose: a poisoned cache entry restored into a
      # release build could end up inside a shipped binary (zizmor's
      # cache-poisoning audit flags exactly this pattern). A cold build once
      # per release is a price worth paying.

      - name: Build launchers and write SHA256SUMS (dist.ps1)
        # NOMAD_SIGN_CERT / NOMAD_SIGNING_KEY are deliberately not set, so
        # dist.ps1 runs a locked x64 Windows build, validates the exact artifact
        # set, stages licenses and writes the SHA256SUMS manifest, with
        # artifact naming identical to a local build. The "UNSIGNED" warnings
        # for unrequested signing are expected here.
        run: .\dist.ps1

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            target/release/Nomad-*.exe
            target/release/SHA256SUMS

      - name: Bundle third-party licenses
        # dist.ps1 stages these beside the binaries; a release page can't hold
        # a directory, so ship the bundle as one zip.
        run: >-
          Compress-Archive -Force
          -DestinationPath target\release\licenses.zip
          -Path target\release\licenses,
          target\release\THIRD-PARTY-NOTICES.txt,
          target\release\TRADEMARKS.md

      - name: Create draft release and upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: .\scripts\publish-draft-release.ps1 -Tag $env:TAG -Repository $env:GITHUB_REPOSITORY
